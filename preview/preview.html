<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini chat PDF</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../assets/icon32.png" alt="" width="32" height="32" class="brand-icon">
      <div class="brand-copy">
        <p class="eyebrow">Gemini export</p>
        <h1 id="docTitle">Preparing your PDF…</h1>
        <p class="doc-meta" id="docMeta"></p>
      </div>
    </div>

    <div class="toolbar">
      <a class="btn ghost source-btn" id="sourceLink" href="#" target="_blank" rel="noreferrer" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true">
          <path d="M14 4h6v6M20 4l-9 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 13.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Original</span>
      </a>

      <button type="button" class="btn ghost" id="printButton" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
          <path d="M7 9V4h10v5M7 18H5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 14h10v6H7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span class="btn-label">Print</span>
      </button>

      <button type="button" class="btn primary" id="saveButton" disabled>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">
          <path d="M12 3.5v11m-4-4 4 4 4-4M4.5 17.5v2a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Save PDF</span>
      </button>
    </div>
  </header>

  <main>
    <section class="loading" id="loading" aria-live="polite">
      <div class="loading-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="25" height="25" fill="none">
          <path d="M12 2.5c.38 4.67 2.83 7.12 7.5 7.5-4.67.38-7.12 2.83-7.5 7.5-.38-4.67-2.83-7.12-7.5-7.5 4.67-.38 7.12-2.83 7.5-7.5Z" fill="currentColor"/>
        </svg>
      </div>
      <h2>Preparing your PDF</h2>
      <p id="loadingText">Reading the selected conversation…</p>
      <div class="progress" role="progressbar" aria-label="PDF preparation progress">
        <span class="progress-bar" id="progressBar"></span>
      </div>
    </section>

    <section class="error-state" id="errorPanel" hidden>
      <div class="error-card">
        <div class="error-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="38" height="38" fill="none">
            <path d="M13 5h14l9 9v27a2 2 0 0 1-2 2H13a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M27 5v9h9" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M24 22v8m0 5v.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
          </svg>
        </div>
        <h2 id="errorTitle">Something went wrong</h2>
        <p id="errorText"></p>
        <div class="error-actions" id="errorActions"></div>
      </div>
    </section>

    <section class="viewer" id="viewer" hidden>
      <div class="pages" id="pages"></div>
      <div class="end-note" id="endNote" hidden>
        <span class="end-line"></span>
        <span>End of conversation</span>
        <span class="end-line"></span>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="../vendor/pdf.min.js"></script>
  <script src="../vendor/pdfmake.min.js"></script>
  <script src="../vendor/vfs_fonts.js"></script>
  <script src="../vendor/extra-fonts.js"></script>
  <script src="pdf-builder.js"></script>
  <script src="preview.js"></script>
</body>
</html>
